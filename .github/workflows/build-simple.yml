name: Build KodiaNew Simple (Skip Native Modules)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-simple'

jobs:
  build-simple:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (skip optional native modules)
        run: |
          # Instalar sin módulos nativos opcionales
          npm install --legacy-peer-deps --ignore-scripts --no-optional
        shell: powershell
        continue-on-error: false

      - name: Post-install scripts (selective)
        run: |
          # Ejecutar solo scripts críticos
          Write-Host "Running selective post-install scripts..." -ForegroundColor Cyan

          # Verificar estructura
          if (Test-Path "node_modules") {
            Write-Host "✓ node_modules instalado" -ForegroundColor Green
          }
        shell: powershell

      - name: Build React components
        run: |
          if (npm run buildreact 2>&1) {
            Write-Host "✓ React build exitoso" -ForegroundColor Green
          } else {
            Write-Host "⚠ React build falló (continuando)" -ForegroundColor Yellow
          }
        shell: powershell
        continue-on-error: true

      - name: Compile TypeScript
        run: |
          npm run compile 2>&1 | Tee-Object -Variable compileOutput
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✓ TypeScript compile exitoso" -ForegroundColor Green
          } else {
            Write-Host "⚠ Compile con errores (continuando)" -ForegroundColor Yellow
          }
        shell: powershell
        continue-on-error: true

      - name: Verify build output
        run: |
          Write-Host "Verificando archivos compilados..." -ForegroundColor Cyan

          if (Test-Path "out") {
            $outFiles = (Get-ChildItem -Path "out" -Recurse -File).Count
            Write-Host "✓ Carpeta out/ existe con $outFiles archivos" -ForegroundColor Green
          } else {
            Write-Host "✗ Carpeta out/ no existe" -ForegroundColor Red
          }

          if (Test-Path "extensions") {
            $extDirs = (Get-ChildItem -Path "extensions" -Directory).Count
            Write-Host "✓ Carpeta extensions/ existe con $extDirs extensiones" -ForegroundColor Green
          } else {
            Write-Host "✗ Carpeta extensions/ no existe" -ForegroundColor Red
          }
        shell: powershell

      - name: Create distribution package
        run: |
          $distFolder = "kodia-dist"
          Write-Host "Creando paquete de distribución..." -ForegroundColor Cyan

          New-Item -ItemType Directory -Force -Path $distFolder | Out-Null

          # Copiar archivos compilados
          if (Test-Path "out") {
            Write-Host "  Copiando out/..." -ForegroundColor Gray
            Copy-Item -Path "out" -Destination "$distFolder\out" -Recurse -Force
          }

          if (Test-Path "extensions") {
            Write-Host "  Copiando extensions/..." -ForegroundColor Gray
            Copy-Item -Path "extensions" -Destination "$distFolder\extensions" -Recurse -Force
          }

          if (Test-Path "resources") {
            Write-Host "  Copiando resources/..." -ForegroundColor Gray
            Copy-Item -Path "resources" -Destination "$distFolder\resources" -Recurse -Force
          }

          if (Test-Path "node_modules") {
            Write-Host "  Copiando node_modules/ (solo producción)..." -ForegroundColor Gray
            # Copiar solo módulos necesarios para runtime
            Copy-Item -Path "node_modules" -Destination "$distFolder\node_modules" -Recurse -Force
          }

          # Copiar archivos de configuración
          Write-Host "  Copiando archivos de configuración..." -ForegroundColor Gray
          Copy-Item -Path "package.json" -Destination "$distFolder\" -Force
          Copy-Item -Path "product.json" -Destination "$distFolder\" -Force
          Copy-Item -Path "LICENSE.txt" -Destination "$distFolder\" -Force
          Copy-Item -Path "README.md" -Destination "$distFolder\" -Force

          # Copiar documentación de 9Router
          Write-Host "  Copiando documentación 9Router..." -ForegroundColor Gray
          Copy-Item -Path "INTEGRATION_9ROUTER.md" -Destination "$distFolder\" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "README_9ROUTER_ES.md" -Destination "$distFolder\" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "QUICK_START.md" -Destination "$distFolder\" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "CHANGELOG_9ROUTER.md" -Destination "$distFolder\" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "README_KODIANEW.md" -Destination "$distFolder\" -Force -ErrorAction SilentlyContinue

          # Crear README de instalación
          @"
# KodiaNew - Instalación

## Requisitos

- Node.js 20.x o superior

## Instrucciones

1. Extrae este ZIP en una carpeta (ej: C:\KodiaNew)

2. Instala dependencias de producción (opcional, ya están incluidas):
   ``````powershell
   npm install --production
   ``````

3. Ejecuta KodiaNew:
   ``````powershell
   node out\server-main.js
   ``````

   O busca el ejecutable principal en la carpeta.

## Configurar 9Router

1. Ejecuta 9Router localmente:
   ``````bash
   git clone https://github.com/decolua/9router
   cd 9router
   npm install
   npm start
   ``````

2. En KodiaNew:
   - Settings → Void → Providers
   - Selecciona "9Router"
   - Endpoint ya configurado: http://localhost:20128

3. ¡Empieza a codear con IA gratis!

## Modelos Disponibles

- kr/claude-sonnet-4.5 (Kiro AI) ⭐
- kr/glm-5 (Kiro AI)
- opencode/claude-sonnet-4.5 (OpenCode)
- deepseek-chat
- deepseek-reasoner

## Documentación

- INTEGRATION_9ROUTER.md - Guía técnica
- README_9ROUTER_ES.md - Docs completa
- QUICK_START.md - Inicio rápido

"@ | Out-File -FilePath "$distFolder\INSTALAR.md" -Encoding utf8

          Write-Host "✓ Paquete de distribución creado" -ForegroundColor Green
        shell: powershell

      - name: Create ZIP
        run: |
          Write-Host "Comprimiendo paquete..." -ForegroundColor Cyan
          Compress-Archive -Path "kodia-dist\*" -DestinationPath "KodiaNew-Windows-x64-Simple.zip" -Force

          $zipSize = (Get-Item "KodiaNew-Windows-x64-Simple.zip").Length / 1MB
          Write-Host "✓ ZIP creado: KodiaNew-Windows-x64-Simple.zip ($([math]::Round($zipSize, 2)) MB)" -ForegroundColor Green
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KodiaNew-Windows-x64-Simple
          path: KodiaNew-Windows-x64-Simple.zip
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: KodiaNew-Windows-x64-Simple.zip
          body: |
            # KodiaNew con 9Router Integrado (Build Simple)

            **Nota**: Este build omite algunos módulos nativos opcionales para evitar problemas de compilación.
            La funcionalidad principal está completa.

            ## 🚀 Instalación Rápida

            1. Descarga `KodiaNew-Windows-x64-Simple.zip`
            2. Extrae en una carpeta
            3. Lee `INSTALAR.md` para instrucciones

            ## ⚙️ Configuración de 9Router

            ```bash
            # En otra terminal
            git clone https://github.com/decolua/9router
            cd 9router
            npm start
            ```

            En KodiaNew, el provider **9Router** ya está configurado con endpoint `http://localhost:20128`

            ## ✨ Modelos Disponibles

            - `kr/claude-sonnet-4.5` ⭐ Recomendado
            - `kr/glm-5`
            - `opencode/claude-sonnet-4.5`
            - `deepseek-chat`
            - `deepseek-reasoner`

            ¡Disfruta de IA gratis para codear! 🎉
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
